name: Keep-alive

# Evita que o Supabase (plano free) pause os bancos após 7 dias sem atividade
# e acorda os serviços do Render. Roda a cada 2 dias + manual.
on:
  schedule:
    - cron: "17 11 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL || 'https://clube-do-gole-backend.onrender.com' }}
      STRAPI_URL: ${{ vars.STRAPI_URL || 'https://clube-do-gole-strapi.onrender.com' }}
    steps:
      - name: Backend + banco do backend
        run: |
          curl -fsS --retry 5 --retry-delay 30 --retry-all-errors -m 120 "$BACKEND_URL/health"
      - name: Strapi + banco do Strapi
        run: |
          # /api/faqs consulta o banco do Strapi (projeto Supabase separado)
          curl -fsS --retry 5 --retry-delay 30 --retry-all-errors -m 120 -o /dev/null -w "%{http_code}\n" "$STRAPI_URL/api/faqs"
